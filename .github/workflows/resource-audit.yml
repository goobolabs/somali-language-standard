name: Resource audit

"on":
  pull_request:
    paths:
      - "resources/**"
      - "data/provenance/**"
      - "tools/audit_resources.py"
      - "tools/resource_audit/**"
      - "tools/tests/**"
      - "docs/RESOURCE_AUDIT.md"
      - ".github/workflows/resource-audit.yml"
  push:
    paths:
      - "resources/**"
      - "data/provenance/**"
      - "tools/audit_resources.py"
      - "tools/resource_audit/**"
      - "tools/tests/**"
      - "docs/RESOURCE_AUDIT.md"
      - ".github/workflows/resource-audit.yml"

permissions:
  contents: read

jobs:
  validate-resources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile validator
        run: python -m compileall -q tools
      - name: Run validator tests
        env:
          PYTHONPATH: tools
        run: python -m unittest discover -s tools/tests -v
      - name: Audit resources against reviewed baseline
        run: >-
          python tools/audit_resources.py audit
          --root .
          --baseline data/provenance/audit-baseline.json
          --suppressions data/provenance/audit-suppressions.tsv
          --fail-on-new warning
